[package]
name = "enventory"
version = "0.2.0"
edition.workspace = true
description = "A typed, self-documenting environment variable registry"
license = "MIT"
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
enventory-core = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

[features]
default = []
inventory = ["dep:inventory", "dep:enventory-core"]
clap = ["inventory", "dep:clap"]

[dependencies.clap]
workspace = true
optional = true

[dev-dependencies]
expect-test = { workspace = true }

[[test]]
name = "clap_roundtrip"
required-features = ["clap"]

[[test]]
name = "multiple_definitions"
required-features = ["clap"]

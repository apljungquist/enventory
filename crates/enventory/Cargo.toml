[package]
name = "enventory"
version = "0.1.1"
edition.workspace = true
description = "A typed, self-documenting environment variable registry"
license = "MIT"
readme = "../../README.md"

[dependencies]
enventory-core = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

[features]
default = []
inventory = ["dep:inventory", "dep:enventory-core"]
clap = ["inventory", "dep:clap"]

[dependencies.clap]
workspace = true
optional = true

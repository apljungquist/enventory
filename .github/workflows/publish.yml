name: Publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p enventory
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
